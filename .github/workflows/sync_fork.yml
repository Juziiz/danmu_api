name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                fetch-depth: 0

            - name: Fast-forward sync with upstream
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git remote add upstream https://github.com/huangxd-/danmu_api.git
                git fetch upstream main
                # 仅允许快进合并；若上游与本地分叉则失败告警，避免覆盖仓库自有提交
                git merge --ff-only FETCH_HEAD
                git push origin main

            - name: Check for new commits
              if: success()
              run: echo "Sync completed successfully"

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. Non-fast-forward upstream changes needing manual merge"
                  echo "2. Network issues"
                  echo "Please check the logs and consider manual sync if needed."
                  exit 1
